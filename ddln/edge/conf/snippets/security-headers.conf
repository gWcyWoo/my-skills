# dpt edge / snippets/security-headers.conf —— 安全响应头(HTTPS vhost include)。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;  # 无 preload(承诺项)
# CSP 与业务强相关:上线时按页面资源定,先留注释(建议先 Report-Only 调)。
# add_header Content-Security-Policy "default-src 'self'" always;
