# dpt edge / conf.d/000-placeholder.conf —— 占位 default vhost。
# 作用:① 未知 Host 直接 444(挡直连 IP 扫描);② 443 用自签证书起一个"边缘就绪"占位页。
# 具体业务:新增 conf.d/<site>.conf(有 server_name),会优先于本 default。

# HTTP:未知 Host 一律 444(不泄露、不重定向给扫描器)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# HTTPS:占位边缘(自签证书),业务 vhost 就绪前先 hold
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    include snippets/tls.conf;
    include snippets/security-headers.conf;
    include snippets/deny-dotfiles.conf;

    location / {
        include snippets/ratelimit.conf;
        default_type text/plain;
        return 200 "dpt edge ready\n";
    }
}
