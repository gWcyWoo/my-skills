# dpt edge / nginx.conf —— 宿主公网边缘全局配置(加固 + 性能基线)。
# 由 deploy_config.sh 部署;具体业务只在 conf.d/ 加一个 vhost,include snippets/ 即可。
user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

# 主上下文 include:动态模块(WAF 的 load_module 由 install_waf 写进 modules-enabled/)
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ---- 基础/安全 ----
    server_tokens off;
    charset utf-8;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 请求硬化(防 slowloris / 超大请求)
    client_max_body_size 16m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    large_client_header_buffers 4 8k;

    # ---- 性能:IO + keepalive ----
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ---- 日志(边缘:看真实客户端 IP)----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---- gzip(只压文本)----
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ---- 限速区(片段 ratelimit.conf 引用)----
    limit_req_zone  $binary_remote_addr zone=req_per_ip:10m  rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ---- 业务 vhost(具体业务往 conf.d/ 加 .conf)----
    include /etc/nginx/conf.d/*.conf;
}
