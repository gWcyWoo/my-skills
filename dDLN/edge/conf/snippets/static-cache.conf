# dpt edge / snippets/static-cache.conf —— 静态资源长缓存(server include)。
location ~* \.(?:jpg|jpeg|png|gif|ico|webp|svg|css|js|woff2?|ttf|eot|map)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
    open_file_cache max=2000 inactive=60s;
    try_files $uri =404;
}
