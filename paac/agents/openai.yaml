interface:
  display_name: "PAAC API Dev"
  short_description: "Implement ThinkPHP 6 APIs from Apifox contracts with TDD gates."
  default_prompt: "Use PAAC for one ThinkPHP 6 endpoint: refresh Apifox, read the endpoint contract, derive controller/action, collect mode-scoped repo evidence in the PAAC ledger, reuse/update/add to match Apifox, put non-empty description in the action header comment, use controller-only mock mode plus integration contract tests when description is empty, and follow tdd-gates otherwise."
