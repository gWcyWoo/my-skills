interface:
  display_name: "PAAC API Dev"
  short_description: "Implement ThinkPHP 6 APIs from Apifox contracts with TDD gates."
  default_prompt: "Use PAAC for one ThinkPHP 6 endpoint: refresh Apifox OAS, read the interface contract and $ref resources, derive controller/action from endpoint, inspect code through my-explore-0, reuse/update/add the endpoint to match Apifox exactly, put Apifox description in the action method header comment, and follow tdd-gates red-to-green."
